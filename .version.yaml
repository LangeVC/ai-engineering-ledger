schema: 1
source_of_truth: pyproject.toml
locations:
  - path: pyproject.toml
    pattern: '^version\s*=\s*"(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)"$'
    required: true
release_title_pattern: '^AI Engineering Ledger v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
release_title_example: 'AI Engineering Ledger v0.2.0'
